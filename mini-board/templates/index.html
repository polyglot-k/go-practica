<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Board</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Mini Board</h1>
        <a href="/posts/new" class="btn btn-primary">New Post</a>
        <hr>
        {{range .}}
        <div class="post">
            <h2>{{.Title}}</h2>
            <p>{{.Content}}</p>
            <div class="post-actions">
                <a href="/posts/edit?id={{.ID}}">Edit</a>
                <form action="/posts/delete?id={{.ID}}" method="POST" style="display:inline;">
                    <button type="submit" class="btn-danger">Delete</button>
                </form>
            </div>
        </div>
        {{else}}
        <p>No posts yet. Create one!</p>
        {{end}}
    </div>
</body>
</html>
